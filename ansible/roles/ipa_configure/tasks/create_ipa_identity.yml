---
- name: Create Infrastructure Admin Group
  freeipa.ansible_freeipa.ipagroup:
    ipaadmin_password: "{{ ipa_admin_password }}"
    name: "infra_admins"
    description: "Infrastructure administrators group"
    state: present

- name: Create Infrastructure Admin User
  freeipa.ansible_freeipa.ipauser:
    ipaadmin_password: "{{ ipa_admin_password }}"
    name: "infra_admin"
    first: "Infra"
    last: "Admin"
    password: "{{ infra_admin_pass }}"
    sshpubkey:
      - "{{ lookup('file', '~/.ssh/id_rsa.pub') }}"
    state: present

- name: Add infra_admin to infra_admins group
  freeipa.ansible_freeipa.ipagroup:
    ipaadmin_password: "{{ ipa_admin_password }}"
    name: "infra_admins"
    user:
      - "infra_admin"
    action: member
    state: present

- name: Create Music Server Admin Group
  freeipa.ansible_freeipa.ipagroup:
    ipaadmin_password: "{{ ipa_admin_password }}"
    name: "music-admins"
    description: "Music Server administrators group"
    state: present

- name: Create Music Server Admin User
  freeipa.ansible_freeipa.ipauser:
    ipaadmin_password: "{{ ipa_admin_password }}"
    name: "music_admin"
    first: "Music"
    last: "Admin"
    password: "{{ music_admin_pass }}"
    state: present

- name: Add music_admin to music-admins group
  freeipa.ansible_freeipa.ipagroup:
    ipaadmin_password: "{{ ipa_admin_password }}"
    name: "music-admins"
    user:
      - "music_admin"
    action: member
    state: present

- name: Restrict default allow_all HBAC rule to administrative groups only
  freeipa.ansible_freeipa.ipahbacrule:
    ipaadmin_password: "{{ ipa_admin_password }}"
    name: "allow_all"
    group:
      - "admins"
      - "infra_admins"
    usercategory: ""
    state: present

- name: Create HBAC rule allowing infra_admins to access all infra hosts
  freeipa.ansible_freeipa.ipahbacrule:
    ipaadmin_password: "{{ ipa_admin_password }}"
    name: "access-infra-admins-all"
    description: "Allow infra-admins group access to all cluster nodes"
    group:
      - "infra_admins"
    hostcategory: "all"
    servicecategory: "all"
    state: present

