---

- name: Ensure firewalld service is started and enabled
  ansible.builtin.systemd:
    name: firewalld
    state: started
    enabled: true

- name: Ensure firewalld allows services for FreeIPA
  ansible.builtin.firewalld:
    service: "{{ item }}"
    permanent: true
    state: enabled
    immediate: true
  loop:
    - http
    - https
    - dns
    - ntp
    - kerberos
    - kpasswd
    - ldap
    - ldaps
    - freeipa-4

- name: Ensure firewalld allows TACACS+
  ansible.builtin.firewalld:
    port: 49/tcp
    permanent: true
    state: enabled
    immediate: true
